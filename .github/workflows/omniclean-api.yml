name: OmniClean API

on:
  push:
    paths:
      - 'apps/api/**'
      - '.github/workflows/omniclean-api.yml'
  pull_request:
    paths:
      - 'apps/api/**'
      - '.github/workflows/omniclean-api.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - name: Install
        run: npm ci
      - name: Unit tests
        env:
          NODE_ENV: development
          ALLOW_INSECURE_JWT: 'true'
          JWT_SECRET: 'ci-test-secret-at-least-32-characters-long!!'
        run: npm test
