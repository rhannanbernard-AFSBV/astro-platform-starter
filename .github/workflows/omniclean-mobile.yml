name: OmniClean Mobile

on:
  push:
    paths:
      - 'apps/mobile/**'
      - '.github/workflows/omniclean-mobile.yml'
  pull_request:
    paths:
      - 'apps/mobile/**'
      - '.github/workflows/omniclean-mobile.yml'

jobs:
  typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install
        run: npm install
      - name: Typecheck
        run: npm run typecheck
