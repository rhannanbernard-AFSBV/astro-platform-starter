# Allyanna Accounting — production API gateway
# SSL termination + reverse proxy. Preserves multi-tenant headers
# (X-Tenant-ID, X-User-Id, X-Role) without rewriting or dropping them.

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Hyphenated Allyanna headers are valid by default; keep underscores enabled
    # for any alternate clients that send X_Tenant_ID-style names.
    underscores_in_headers on;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" tenant="$http_x_tenant_id"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    client_max_body_size 25m;

    # Do not buffer request bodies for OCR uploads unnecessarily long.
    proxy_request_buffering on;

    # Map client multi-tenant headers so empty values stay empty (no injection).
    map $http_x_tenant_id $pass_x_tenant_id {
        default $http_x_tenant_id;
        ""      "";
    }
    map $http_x_user_id $pass_x_user_id {
        default $http_x_user_id;
        ""      "";
    }
    map $http_x_role $pass_x_role {
        default $http_x_role;
        ""      "";
    }
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ""      close;
    }

    upstream allyanna_frontend {
        server frontend:3000;
        keepalive 16;
    }

    upstream allyanna_backend {
        server backend:8000;
        keepalive 32;
    }

    # Redirect cleartext → TLS
    server {
        listen 80;
        listen [::]:80;
        server_name _;

        location /healthz {
            access_log off;
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        server_name _;

        # Mount real certs at /etc/nginx/ssl (see nginx/ssl/README.md).
        ssl_certificate     /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;
        ssl_session_timeout 1d;
        ssl_session_cache shared:SSL:10m;
        ssl_session_tickets off;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;

        # Harden edge headers (do not touch tenant headers).
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;

        # FastAPI API — path preserved; tenant header forwarded verbatim.
        location /api/ {
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";

            # Pass multi-tenant headers without tampering (value = client value).
            proxy_set_header X-Tenant-ID $pass_x_tenant_id;
            proxy_set_header X-User-Id $pass_x_user_id;
            proxy_set_header X-Role $pass_x_role;
            proxy_set_header Authorization $http_authorization;

            proxy_pass http://allyanna_backend;
        }

        # Backend health (optional ops probe through the gateway).
        location = /backend/health {
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_pass http://allyanna_backend/health;
        }

        # Next.js app
        location / {
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_pass http://allyanna_frontend;
        }
    }
}
