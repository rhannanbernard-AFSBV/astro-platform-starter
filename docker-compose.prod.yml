# Allyanna Accounting — production compose
# Frontend (Next.js) + FastAPI + isolated PostgreSQL + nginx gateway
#
# Prerequisites:
#   - backend/ and frontend/ application sources (Allyanna FastAPI + Next.js)
#   - backend/migrations/*.sql + backend/scripts/migrate.sh (applied by migrate)
#   - cp .env.production.example .env.production  # fill secrets; never commit
#   - TLS certs in nginx/ssl/ (see nginx/ssl/README.md)
#
# Target layout:
#   backend/Dockerfile  frontend/Dockerfile  nginx/nginx.conf  docker-compose.prod.yml
#
# Bring-up order:
#   postgres (healthy) → migrate (psql SQL, exit 0) → backend → frontend → nginx
#
# Start:
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build

name: allyanna-prod

services:
  postgres:
    image: postgres:16-alpine
    container_name: allyanna-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env.production}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.production}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env.production}
    volumes:
      - allyanna_pg_data:/var/lib/postgresql/data
    # Not published to the host — reachable only on the internal network.
    expose:
      - "5432"
    networks:
      - allyanna_internal
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  # One-shot migrator: applies backend/migrations/*.sql before API traffic.
  # Uses DATABASE_URL (bootstrap/superuser) + ALLYANNA_APP_PASSWORD (app role).
  migrate:
    image: postgres:16-alpine
    container_name: allyanna-migrate
    restart: "on-failure"
    env_file:
      - .env.production
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env.production}
      ALLYANNA_APP_PASSWORD: ${ALLYANNA_APP_PASSWORD:?set ALLYANNA_APP_PASSWORD in .env.production}
      MIGRATIONS_DIR: /migrations
      ALLYANNA_SEED_DEMO_TENANT: ${ALLYANNA_SEED_DEMO_TENANT:-true}
    volumes:
      - ./backend/migrations:/migrations:ro
      - ./backend/scripts/migrate.sh:/migrate.sh:ro
    entrypoint: ["/bin/sh", "/migrate.sh"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - allyanna_internal

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: allyanna-backend:prod
    container_name: allyanna-backend
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      # Runtime uses least-privilege allyanna_app_user (created/rotated by migrate).
      DATABASE_URL: ${ALLYANNA_DATABASE_URL:?set ALLYANNA_DATABASE_URL in .env.production}
      ALLYANNA_DATABASE_URL: ${ALLYANNA_DATABASE_URL:?set ALLYANNA_DATABASE_URL in .env.production}
      OPENAI_API_KEY: ${OPENAI_API_KEY:?set OPENAI_API_KEY in .env.production}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env.production}
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - allyanna_internal
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://127.0.0.1:8000/health || exit 1",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 25s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Browser origin for FastAPI (paths are /api/v1/...; nginx proxies /api/).
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-https://localhost}
    image: allyanna-frontend:prod
    container_name: allyanna-frontend
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-https://localhost}
    expose:
      - "3000"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - allyanna_internal
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1:3000/ >/dev/null || exit 1",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    image: allyanna-nginx:prod
    container_name: allyanna-nginx
    restart: unless-stopped
    ports:
      - "${ALLYANNA_HTTP_PORT:-80}:80"
      - "${ALLYANNA_HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    networks:
      - allyanna_internal
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1/healthz >/dev/null || exit 1",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s

networks:
  allyanna_internal:
    driver: bridge
    internal: false

volumes:
  allyanna_pg_data:
    name: allyanna_pg_data
